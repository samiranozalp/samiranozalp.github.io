<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samiran Ehliyet Sınavı</title>
<style>
:root {
  --bg:#f2f4f7;
  --card:#fff;
  --text:#20252d;
  --muted:#687385;
  --border:#dce1e8;
}
body.dark {
  --bg:#171a20;
  --card:#242933;
  --text:#f4f5f7;
  --muted:#b5bdc9;
  --border:#3b4350;
}
* { box-sizing:border-box; }
body {
  margin:0;
  padding:16px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  font-size:18px;
}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
h1 { font-size:24px; margin:8px 0; }
button {
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.small { background:var(--border); color:var(--text); }
.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}
.tests {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.test {
  min-width:0;
  padding:14px 5px;
  color:white;
  min-height:120px;
}
.test strong { display:block; font-size:17px; }
.test span { display:block; margin-top:9px; font-size:13px; }
.easy { background:#249b59; }
.normal { background:#d49b16; }
.hard { background:#d94b4b; }
.hidden { display:none; }
.question { font-size:20px; line-height:1.5; }
.option {
  display:block;
  width:100%;
  text-align:left;
  margin:9px 0;
  background:var(--bg);
  color:var(--text);
  border:2px solid var(--border);
}
.option.correct { background:#d5f5df; color:#125d2b; border-color:#249b59; }
.option.wrong { background:#ffe0e0; color:#8b1717; border-color:#d94b4b; }
body.dark .option.correct { background:#174b2a; color:white; }
body.dark .option.wrong { background:#5a2525; color:white; }
.feedback { padding:12px; border-radius:10px; margin-top:12px; }
.green { background:#d5f5df; color:#125d2b; }
.red { background:#ffe0e0; color:#8b1717; }
body.dark .green { background:#174b2a; color:white; }
body.dark .red { background:#5a2525; color:white; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:15px; }
.actions button { flex:1; }
.primary { background:#2468d8; color:white; }
.muted { color:var(--muted); font-size:14px; }
.wrong-item { display:flex; justify-content:space-between; gap:8px; align-items:center; }
.wrong-item button { background:#d94b4b; color:white; padding:8px; }
.scene {
  background:#dceefa;
  color:#172b3c;
  padding:16px;
  border-radius:12px;
  margin:12px 0;
  text-align:center;
  animation:sceneIn .7s ease;
}
@keyframes sceneIn {
  from { opacity:0; transform:translateY(10px); }
  to { opacity:1; transform:translateY(0); }
}
.road {
  height:75px;
  background:#555;
  border-radius:8px;
  position:relative;
  margin:12px 0;
  overflow:hidden;
}
.road:after {
  content:"";
  position:absolute;
  left:0; right:0; top:36px;
  border-top:3px dashed white;
}
.car {
  position:absolute;
  top:13px;
  left:15%;
  font-size:35px;
  animation:drive 3s infinite alternate ease-in-out;
}
@keyframes drive {
  from { left:10%; }
  to { left:70%; }
}
@media(max-width:360px) {
  body { padding:9px; font-size:16px; }
  .test strong { font-size:14px; }
}
</style>
</head>
<body>

<header>
  <h1>🚘 Samiran Ehliyet Sınavı</h1>
  <div>
    <button class="small" onclick="fontChange(-1)">A−</button>
    <button class="small" onclick="fontChange(1)">A+</button>
    <button class="small" onclick="themeChange()">🌙</button>
  </div>
</header>

<main id="home">
  <div class="card">
    <h2>Günlük sınavların</h2>
    <p id="date" class="muted"></p>
    <p>Bugün çözmek istediğin sınavı seç.</p>
    <div class="tests">
      <button class="test easy" onclick="startTest('Kolay')">
        <strong>😊 KOLAY</strong>
        <span>50 soru</span>
      </button>
      <button class="test normal" onclick="startTest('Normal')">
        <strong>📘 NORMAL</strong>
        <span>50 soru</span>
      </button>
      <button class="test hard" onclick="startTest('Zor')">
        <strong>🧠 ZOR</strong>
        <span>50 soru</span>
      </button>
    </div>
  </div>

  <div class="card">
    <h3>📊 İstatistikler</h3>
    <p id="stats">Henüz sınav çözmedin.</p>
  </div>

  <div class="card">
    <h3>❌ Yanlış cevaplarım</h3>
    <div id="wrongList">Henüz yanlış cevabın yok.</div>
  </div>
</main>

<main id="exam" class="hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;gap:8px">
      <strong id="examTitle"></strong>
      <strong id="counter"></strong>
    </div>
    <div style="height:8px;background:var(--border);border-radius:9px;margin:12px 0">
      <div id="progress" style="height:8px;background:#249b59;width:0%;border-radius:9px"></div>
    </div>
    <div id="scene"></div>
    <p id="question" class="question"></p>
    <div id="options"></div>
    <div id="feedback"></div>
    <div class="actions">
      <button class="small" onclick="previousQuestion()">◀ Önceki</button>
      <button class="primary" onclick="nextQuestion()">Sonraki ▶</button>
    </div>
    <div class="actions">
      <button class="small" onclick="finishTest()">Sınavı bitir</button>
      <button class="small" onclick="goHome()">Ana sayfa</button>
    </div>
  </div>
</main>

<script>
const bank = {
  Kolay: [
    {q:"Kırmızı trafik ışığı ne anlama gelir?",o:["Dur","Hızlan","Yavaşla"],a:0,e:"Kırmızı ışıkta durulur."},
    {q:"Emniyet kemeri ne için kullanılır?",o:["Güvenlik için","Aracı hızlandırmak için","Yakıt tasarrufu için"],a:0,e:"Emniyet kemeri yaralanma riskini azaltır."},
    {q:"Yaya geçidine yaklaşırken ne yapılmalıdır?",o:["Hız artırılır","Yavaşlanır ve yayalara yol verilir","Korna çalınır"],a:1,e:"Yayalara geçiş hakkı verilmelidir."},
    {q:"Araç kullanırken telefonla ilgilenmek doğru mudur?",o:["Evet","Hayır","Sadece şehir dışında"],a:1,e:"Sürüş sırasında telefonla ilgilenmek dikkat dağıtır."},
    {q:"Trafikte ambulansın sireni duyulursa ne yapılır?",o:["Yol verilir","Takip edilir","Yarışılır"],a:0,e:"Geçiş üstünlüğü olan araca güvenli şekilde yol verilir."},
    {q:"Araçta ilk yardım çantası bulundurulmalı mıdır?",o:["Evet","Hayır","Sadece kışın"],a:0,e:"Araçta gerekli güvenlik ekipmanları bulundurulmalıdır."},
    {q:"Yeşil ışık yandığında ne yapılır?",o:["Güvenliyse geçilir","Her durumda hızlanılır","Araç durdurulur"],a:0,e:"Geçiş güvenliyse hareket edilir."},
    {q:"Sürüş öncesinde aynalar nasıl olmalıdır?",o:["Doğru ayarlanmış","Kapalı","Önemsiz"],a:0,e:"Aynalar görüş alanına göre ayarlanmalıdır."},
    {q:"Lastiklerin havası neden kontrol edilir?",o:["Güvenli sürüş için","Rengi değişsin diye","Motor sesi için"],a:0,e:"Doğru lastik basıncı yol tutuşunu etkiler."},
    {q:"Trafikte sabırlı olmak neden önemlidir?",o:["Güvenlik için","Daha hızlı gitmek için","Kuralları unutmak için"],a:0,e:"Sabırlı ve dikkatli olmak kazaları önlemeye yardımcı olur."}
  ],
  Normal: [
    {q:"Takip mesafesi genel olarak nasıl belirlenir?",o:["Hızın yarısı kadar metre","Her zaman 2 metre","Araç boyu kadar"],a:0,e:"Normal şartlarda hızın yarısı kadar metre takip mesafesi bırakılır."},
    {q:"ABS fren sistemi ne işe yarar?",o:["Tekerleklerin kilitlenmesini önlemeye yardımcı olur","Yakıtı artırır","Motoru soğutur"],a:0,e:"ABS, sert frenlemede tekerlek kilitlenmesini önlemeye yardımcı olur."},
    {q:"Sisli havada hangi ışıklar kullanılmalıdır?",o:["Uygun sis ve kısa farlar","Uzun farlar sürekli","Dörtlü flaşör sürekli"],a:0,e:"Görüş koşullarına uygun aydınlatma kullanılmalıdır."},
    {q:"Motor yağının temel görevi nedir?",o:["Hareketli parçaları yağlamak","Lastikleri şişirmek","Camları temizlemek"],a:0,e:"Motor yağı sürtünmeyi ve aşınmayı azaltır."},
    {q:"Kontrolsüz kavşağa yaklaşırken ne yapılır?",o:["Hız azaltılır ve dikkat edilir","Hız artırılır","Korna çalarak geçilir"],a:0,e:"Kavşaklarda hız azaltılmalı ve geçiş kurallarına uyulmalıdır."},
    {q:"Araç hararet göstergesi aşırı yükselirse ne yapılmalıdır?",o:["Güvenli yerde durup motorun soğuması beklenir","Radyatör kapağı hemen açılır","Hız artırılır"],a:0,e:"Motor güvenli yerde durdurulmalı, sıcak soğutma sistemi kapağı açılmamalıdır."},
    {q:"Kaygan zeminde frenleme nasıl yapılmalıdır?",o:["Ani hareketlerden kaçınılarak kontrollü","Sert ve ani","El freniyle sürekli"],a:0,e:"Kaygan zeminde ani fren ve direksiyon hareketlerinden kaçınılır."},
    {q:"Gece karşıdan araç gelirken ne yapılır?",o:["Uzun far kısa fara alınır","Uzun far yakılır","Farlar kapatılır"],a:0,e:"Karşı sürücünün gözünü almamak için kısa far kullanılır."},
    {q:"Akünün temel görevi nedir?",o:["Elektrik enerjisi sağlamak","Yakıtı temizlemek","Lastik basıncını ayarlamak"],a:0,e:"Akü aracın elektrik sistemine enerji sağlar."},
    {q:"Trafik kazasında ilk yapılması gerekenlerden biri nedir?",o:["Olay yeri güvenliğini sağlamak","Araçları hemen hareket ettirmek","Kalabalık oluşturmak"],a:0,e:"Önce olay yeri güvenliği sağlanmalıdır."}
  ],
  Zor: [
    {q:"Araç virajda savrulmaya başlarsa sürücü nasıl davranmalıdır?",o:["Ani fren ve direksiyon hareketlerinden kaçınmalı","Sertçe el frenini çekmeli","Gaza sonuna kadar basmalı"],a:0,e:"Ani hareketler savrulmayı artırabilir. Direksiyon ve hız kontrollü yönetilmelidir."},
    {q:"Aşağıdakilerden hangisi fren mesafesini artırır?",o:["Yüksek hız ve kaygan yol","Düşük hız","İyi lastik durumu"],a:0,e:"Hız arttıkça ve yol tutuşu azaldıkça fren mesafesi uzar."},
    {q:"Bilinci kapalı fakat solunumu olan kişiye hangi pozisyon verilir?",o:["Koma (kurtarma) pozisyonu","Ayakta bekleme","Yüzüstü oturma"],a:0,e:"Uygun durumlarda solunumu olan bilinçsiz kişi kurtarma pozisyonuna alınır ve yardım çağrılır."},
    {q:"Yağ basınç uyarı lambası yanarsa ne yapılmalıdır?",o:["Güvenli yerde durup motor kapatılır","Yola devam edilir","Daha hızlı gidilir"],a:0,e:"Yağ basıncı sorunu motor hasarına yol açabilir."},
    {q:"Virajda güvenli sürüş için hız ne zaman azaltılmalıdır?",o:["Viraja girmeden önce","Virajın ortasında sertçe","Virajdan çıkarken aniden"],a:0,e:"Hız viraja girmeden önce uygun seviyeye düşürülmelidir."},
    {q:"Lastik diş derinliğinin azalması hangi riski artırır?",o:["Yol tutuşunun azalmasını","Motor gücünün artmasını","Yakıt deposunun büyümesini"],a:0,e:"Diş derinliği azaldığında özellikle ıslak zeminde tutunma azalır."},
    {q:"İlk yardımda kanaması olan yaralıya ilk olarak ne yapılır?",o:["Temiz bezle doğrudan bası uygulanır","Yaraya toprak sürülür","Yaralı koşturulur"],a:0,e:"Dış kanamada temiz bez veya gazlı bezle doğrudan bası uygulanır."},
    {q:"Fren pedalında normalden fazla yumuşama hissedilirse ne yapılmalıdır?",o:["Araç güvenli şekilde durdurulup kontrol ettirilir","Sürüşe hızla devam edilir","Pedal önemsenmez"],a:0,e:"Fren sistemindeki sorunlar ciddiye alınmalıdır."},
    {q:"Aşağıdakilerden hangisi yakıt tüketimini artırır?",o:["Ani hızlanma ve sert frenleme","Dengeli hız","Araç bakımının yapılması"],a:0,e:"Ani hızlanma ve frenleme yakıt tüketimini artırabilir."},
    {q:"Kaza yerinde yaralıya yaklaşırken ilk yardımcının önceliği nedir?",o:["Kendi ve olay yeri güvenliğini sağlamak","Yaralıyı hemen ayağa kaldırmak","Fotoğraf çekmek"],a:0,e:"İlk yardımcı önce kendi güvenliğini ve olay yeri güvenliğini sağlamalıdır."}
  ]
};

let currentTest = [];
let currentLevel = "";
let index = 0;
let answers = {};
let fontSize = 18;
let wrong = JSON.parse(localStorage.getItem("samiranWrong") || "[]");
let stats = JSON.parse(localStorage.getItem("samiranStats") || '{"done":0,"correct":0}');

document.getElementById("date").textContent =
  new Date().toLocaleDateString("tr-TR");

function fontChange(change) {
  fontSize = Math.max(14, Math.min(28, fontSize + change));
  document.body.style.fontSize = fontSize + "px";
}

function themeChange() {
  document.body.classList.toggle("dark");
  localStorage.setItem("samiranDark", document.body.classList.contains("dark"));
}

if (localStorage.getItem("samiranDark") === "true") {
  document.body.classList.add("dark");
}

function startTest(level) {
  currentLevel = level;
  const pool = bank[level];

  // Bu örnek sürümde havuzda 10 soru vardır.
  // 50 soruluk sınav ekranı için sorular havuzu 50 farklı soruya tamamlanmalıdır.
  currentTest = [...pool];
  answers = {};
  index = 0;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("exam").classList.remove("hidden");
  document.getElementById("examTitle").textContent = level + " Test";
  showQuestion();
}

function showQuestion() {
  const q = currentTest[index];
  document.getElementById("counter").textContent =
    (index + 1) + " / " + currentTest.length;
  document.getElementById("progress").style.width =
    ((index + 1) / currentTest.length * 100) + "%";

  document.getElementById("question").textContent = q.q;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("scene").innerHTML = "";

  if (q.scene) {
    document.getElementById("scene").innerHTML =
      '<div class="scene"><strong>🚦 Trafik sahnesi</strong><div class="road"><span class="car">🚗</span></div>' +
      q.scene + '</div>';
  }

  const options = document.getElementById("options");
  options.innerHTML = "";

  q.o.forEach((option, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = String.fromCharCode(65 + i) + ") " + option;
    btn.onclick = () => chooseAnswer(i);
    options.appendChild(btn);
  });

  if (answers[index] !== undefined) {
    showFeedback(answers[index]);
  }
}

function chooseAnswer(choice) {
  if (answers[index] !== undefined) return;

  answers[index] = choice;
  const q = currentTest[index];
  const isCorrect = choice === q.a;

  if (!isCorrect) {
    const item = {
      id: Date.now() + "-" + index,
      level: currentLevel,
      q: q.q,
      options: q.o,
      answer: q.a,
      explanation: q.e
    };
    wrong.push(item);
    localStorage.setItem("samiranWrong", JSON.stringify(wrong));
  }

  showFeedback(choice);
  renderWrong();
}

function showFeedback(choice) {
  const q = currentTest[index];
  const buttons = document.querySelectorAll(".option");

  buttons.forEach((btn, i) => {
    if (i === q.a) btn.classList.add("correct");
    if (i === choice && choice !== q.a) btn.classList.add("wrong");
    btn.disabled = true;
  });

  const correct = choice === q.a;
  document.getElementById("feedback").innerHTML =
    '<div class="feedback ' + (correct ? "green" : "red") + '">' +
    (correct ? "✅ Doğru cevap!" : "❌ Yanlış cevap!") +
    "<br><strong>Açıklama:</strong> " + q.e + "</div>";
}

function nextQuestion() {
  if (index < currentTest.length - 1) {
    index++;
    showQuestion();
  } else {
    finishTest();
  }
}

function previousQuestion() {
  if (index > 0) {
    index--;
    showQuestion();
  }
}

function finishTest() {
  let correct = 0;
  currentTest.forEach((q, i) => {
    if (answers[i] === q.a) correct++;
  });

  stats.done++;
  stats.correct += correct;
  localStorage.setItem("samiranStats", JSON.stringify(stats));

  alert(
    "Sınav tamamlandı!\n" +
    "Doğru: " + correct + "\n" +
    "Yanlış: " + (currentTest.length - correct)
  );

  goHome();
}

function goHome() {
  document.getElementById("exam").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  renderStats();
  renderWrong();
}

function renderStats() {
  document.getElementById("stats").textContent =
    "Tamamlanan sınav: " + stats.done +
    " | Toplam doğru: " + stats.correct;
}

function renderWrong() {
  const area = document.getElementById("wrongList");
  area.innerHTML = "";

  if (wrong.length === 0) {
    area.textContent = "Henüz yanlış cevabın yok.";
    return;
  }

  wrong.forEach(item => {
    const box = document.createElement("div");
    box.className = "card wrong-item";

    const info = document.createElement("div");
    info.innerHTML = "<strong>" + item.level + "</strong><br>" + item.q;

    const remove = document.createElement("button");
    remove.textContent = "Kaldır";
    remove.onclick = () => {
      wrong = wrong.filter(x => x.id !== item.id);
      localStorage.setItem("samiranWrong", JSON.stringify(wrong));
      renderWrong();
    };

    box.appendChild(info);
    box.appendChild(remove);
    area.appendChild(box);
  });
}

renderStats();
renderWrong();
</script>
</body>
</html>
