<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ehliyet Sınav Hazırlık</title>

<style>
:root {
  --yazi: 19px;
  --arka: #f1f4f8;
  --kart: #ffffff;
  --metin: #172033;
  --kenar: #dce2eb;
  --yesil: #168544;
  --kirmizi: #d92d35;
  --turuncu: #f0a500;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 14px;
  background: var(--arka);
  color: var(--metin);
  font-family: Arial, sans-serif;
  font-size: var(--yazi);
  transition: background .25s, color .25s, font-size .25s;
}

body.koyu {
  --arka: #151a25;
  --kart: #222b3b;
  --metin: #f4f6fb;
  --kenar: #3b465b;
}

button {
  font: inherit;
  border: 0;
  border-radius: 13px;
  padding: 12px 16px;
  cursor: pointer;
  transition: transform .15s, background .2s;
}

button:active {
  transform: scale(.96);
}

.ust {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 15px;
}

.kutu {
  background: var(--kart);
  border: 1px solid var(--kenar);
  border-radius: 17px;
  padding: 17px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px #0000000b;
}

.baslik {
  font-size: 1.35em;
  font-weight: bold;
  margin-bottom: 10px;
}

.kucuk {
  font-size: .85em;
  opacity: .8;
}

.araclar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.araclar button {
  background: #e8edf5;
  color: #172033;
  font-weight: bold;
}

body.koyu .araclar button {
  background: #354158;
  color: white;
}

.ana {
  background: #245fc7;
  color: white;
}

.yesil {
  background: var(--yesil);
  color: white;
}

.kirmizi {
  background: var(--kirmizi);
  color: white;
}

.turuncu {
  background: var(--turuncu);
  color: #222;
}

.testler {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 10px;
}

.test-kart {
  border: 2px solid var(--kenar);
  border-radius: 15px;
  padding: 15px;
  background: var(--kart);
}

.test-kart button {
  width: 100%;
  margin-top: 10px;
}

.secim {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--kart);
  color: var(--metin);
  border: 2px solid var(--kenar);
  margin: 9px 0;
  padding: 14px;
  border-radius: 13px;
}

.secim:hover {
  border-color: #3978df;
}

.secim.secildi {
  border-color: #3978df;
  background: #dceaff;
  color: #15223b;
}

.secim.dogru {
  border-color: var(--yesil);
  background: #d9f8e5;
  color: #14532d;
}

.secim.yanlis {
  border-color: var(--kirmizi);
  background: #ffe0e0;
  color: #7f1d1d;
}

.geri-bildirim {
  display: none;
  border-radius: 16px;
  padding: 17px;
  margin-top: 15px;
  font-weight: bold;
  animation: giris .35s ease;
}

.geri-bildirim.dogru {
  display: block;
  background: #d8f8e4;
  color: #14532d;
  border: 2px solid #168544;
}

.geri-bildirim.yanlis {
  display: block;
  background: #ffe0e0;
  color: #7f1d1d;
  border: 2px solid #d92d35;
}

@keyframes giris {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.soru-no {
  font-weight: bold;
  margin-bottom: 12px;
}

.alt {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.alt button {
  flex: 1;
}

.ilerleme {
  height: 11px;
  border-radius: 20px;
  background: var(--kenar);
  overflow: hidden;
  margin: 12px 0;
}

.ilerleme-dolgu {
  height: 100%;
  background: #2585df;
  width: 0%;
  transition: width .3s;
}

.soru-gorsel {
  border-radius: 15px;
  background: #dceeff;
  color: #18263b;
  padding: 12px;
  margin: 12px 0;
  overflow: hidden;
}

.yol {
  height: 125px;
  background: #555e6b;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
}

.serit {
  position: absolute;
  top: 59px;
  width: 100%;
  border-top: 4px dashed white;
}

.araba {
  position: absolute;
  top: 68px;
  left: -60px;
  font-size: 35px;
  animation: arabaHareket 5s linear infinite;
}

.yaya {
  position: absolute;
  top: 12px;
  right: 18%;
  font-size: 35px;
  animation: yayaHareket 2.5s ease-in-out infinite alternate;
}

@keyframes arabaHareket {
  from { left: -60px; }
  to { left: 105%; }
}

@keyframes yayaHareket {
  from { transform: translateX(0); }
  to { transform: translateX(-25px); }
}

.sahne-aciklama {
  font-size: .9em;
  margin-top: 8px;
}

.yanlis-satir {
  border: 1px solid var(--kenar);
  border-radius: 13px;
  padding: 13px;
  margin: 10px 0;
}

.yanlis-satir button {
  margin-top: 10px;
}

.gizli {
  display: none !important;
}

</style>
</head>

<body>

<div class="ust">
  <div>
    <div class="baslik">🚘 Ehliyet Sınav Hazırlık</div>
    <div id="tarih" class="kucuk"></div>
  </div>

  <div class="araclar">
    <button onclick="yaziAzalt()">A−</button>
    <button onclick="yaziArtir()">A+</button>
    <button onclick="temaDegistir()">🌙 / ☀️</button>
  </div>
</div>

<section id="anaSayfa">

  <div class="kutu">
    <div class="baslik">Bugünkü sınavların</div>
    <div class="kucuk">
      Her sınav 50 sorudur. Sorular cevaplandıkça ilerlemen kaydedilir.
    </div>
  </div>

  <div class="testler" id="testListesi"></div>

  <div class="kutu">
    <div class="baslik">Çalışma bölümleri</div>
    <div class="araclar">
      <button class="ana" onclick="yanlislariGoster()">Yanlış Cevaplarım</button>
      <button class="ana" onclick="istatistikGoster()">İstatistiklerim</button>
    </div>
  </div>

</section>

<section id="sinavSayfasi" class="gizli">

  <div class="kutu">
    <div class="soru-no" id="soruNo"></div>
    <div class="ilerleme">
      <div class="ilerleme-dolgu" id="ilerleme"></div>
    </div>

    <div id="altKategori" class="kucuk"></div>
    <div id="altinEtiket"></div>

    <div id="soruMetni" class="baslik"></div>
    <div id="soruSahnesi"></div>
    <div id="cevaplar"></div>

    <div id="geriBildirim" class="geri-bildirim"></div>

    <div class="alt">
      <button class="ana" onclick="oncekiSoru()">← Önceki</button>
      <button class="ana" onclick="sonrakiSoru()">Sonraki →</button>
    </div>

    <div class="alt">
      <button onclick="anaSayfayaDon()">Sınavlara dön</button>
      <button class="turuncu" onclick="sinaviBitir()">Sınavı bitir</button>
    </div>
  </div>

</section>

<section id="yanlisSayfasi" class="gizli">
  <div class="kutu">
    <div class="baslik">Yanlış Cevaplarım</div>
    <p class="kucuk">
      Öğrendiğin soruları buradan tek tek kaldırabilirsin.
    </p>
    <div id="yanlisListe"></div>
    <button class="ana" onclick="anaSayfayaDon()">Ana sayfaya dön</button>
  </div>
</section>

<section id="istatistikSayfasi" class="gizli">
  <div class="kutu">
    <div class="baslik">İstatistiklerim</div>
    <div id="istatistikMetni"></div>
    <button class="ana" onclick="anaSayfayaDon()">Ana sayfaya dön</button>
  </div>
</section>

<script>

/* --------------------------------------------------
   SORU HAVUZU
   -------------------------------------------------- */

const sorular = [

/* İLK YARDIM */

{c:"İlk Yardım",q:"İlk yardımın temel amacı aşağıdakilerden hangisidir?",o:["Hayati tehlikeyi ortadan kaldırmak","Hastaya ilaç vermek","Hastayı hemen yürütmek","Her durumda hastaneye taşımak"],a:0,e:"İlk yardımın amacı yaşamı korumak, durumun kötüleşmesini önlemek ve iyileşmeyi kolaylaştırmaktır."},

{c:"İlk Yardım",q:"Bilinci kapalı fakat solunumu olan kişiye hangi pozisyon verilmelidir?",o:["Koma (yan) pozisyonu","Ayakta bekleme","Yüzüstü düz pozisyon","Oturur pozisyon"],a:0,e:"Solunumu olan bilinci kapalı kişiye uygun yan pozisyon verilir ve solunumu takip edilir."},

{c:"İlk Yardım",q:"112 Acil Çağrı Merkezi aranırken öncelikle hangi bilgi verilmelidir?",o:["Olayın yeri ve adresi","Arayan kişinin mesleği","Aracın markası","Kazanın tahmini maliyeti"],a:0,e:"Ekiplerin olay yerine ulaşabilmesi için açık konum bilgisi önemlidir."},

{c:"İlk Yardım",q:"Dış kanaması olan bir kişide ilk olarak ne yapılmalıdır?",o:["Kanayan yere temiz bezle doğrudan bası uygulanır","Yaraya toprak sürülür","Kişiye yiyecek verilir","Yara sürekli yıkanır"],a:0,e:"Ciddi dış kanamalarda doğrudan bası temel ilk yardım uygulamasıdır."},

{c:"İlk Yardım",q:"Kırık şüphesi olan bölgeye nasıl davranılmalıdır?",o:["Hareket ettirilmeden sabitlenmelidir","Zorla düzeltilmelidir","Masaj yapılmalıdır","Sürekli bükülmelidir"],a:0,e:"Kırık şüphesinde bölge bulunduğu pozisyonda sabit tutulmalıdır."},

{c:"İlk Yardım",q:"Yanık bölgesine ilk olarak ne uygulanmalıdır?",o:["Serin akan su","Diş macunu","Yoğurt","Buz doğrudan"],a:0,e:"Yanık bölgesi uygun süre serin akan su altında tutulur. Buz ve ev ürünleri uygulanmaz."},

{c:"İlk Yardım",q:"Solunumu olmayan ve tepki vermeyen yetişkinde ne yapılmalıdır?",o:["112 aranmalı ve temel yaşam desteğine başlanmalıdır","Su içirilmelidir","Ayağa kaldırılmalıdır","Yalnız bırakılmalıdır"],a:0,e:"Acil yardım çağrılır ve eğitimli kişinin temel yaşam desteği uygulaması gerekir."},

{c:"İlk Yardım",q:"Burun kanamasında kişiye hangi pozisyon verilmelidir?",o:["Baş hafifçe öne eğik","Baş tamamen geriye atılmış","Düz sırtüstü","Baş aşağı"],a:0,e:"Baş hafifçe öne eğilir ve burun kanatlarına uygun bası uygulanır."},

{c:"İlk Yardım",q:"Sara nöbeti geçiren kişiye nasıl davranılmalıdır?",o:["Çevresi güvenli hâle getirilir, hareketleri zorla durdurulmaz","Ağzına kaşık konur","Kolları ve bacakları sıkıca tutulur","Su içirilir"],a:0,e:"Kişinin çevresi güvenli hâle getirilir. Ağzına herhangi bir cisim konulmaz."},

{c:"İlk Yardım",q:"Zehirlenme şüphesinde aşağıdakilerden hangisi doğrudur?",o:["112 veya UZEM 114'ten yardım alınır","Her durumda kusturulur","Süt içirilir","Kişi yürütülür"],a:0,e:"Zehirlenmelerde uzman yönlendirmesi olmadan kusturma gibi müdahaleler yapılmamalıdır."},

{c:"İlk Yardım",q:"Şok durumundaki kişide aşağıdakilerden hangisi görülebilir?",o:["Soğuk ve soluk cilt","Aşırı neşe","Sürekli gülme","İşitmenin kesin artması"],a:0,e:"Şokta soluk, soğuk ve nemli cilt görülebilir."},

{c:"İlk Yardım",q:"Omurga yaralanması şüphesi olan kişi nasıl taşınmalıdır?",o:["Gereksiz hareket ettirilmemelidir","Kollarından çekilmelidir","Oturmaya zorlanmalıdır","Başından tutulup kaldırılmalıdır"],a:0,e:"Omurga yaralanması şüphesinde gereksiz hareketten kaçınılır."},

{c:"İlk Yardım",q:"Yetişkin temel yaşam desteğinde göğüs basısı nereye uygulanır?",o:["Göğüs kemiğinin ortasına","Karın bölgesine","Boyna","Kaburgaların yan tarafına"],a:0,e:"Göğüs basısı göğüs kemiğinin ortasına uygulanır."},

{c:"İlk Yardım",q:"Donma tehlikesi yaşayan kişiye nasıl yardım edilmelidir?",o:["Ilık ve korunaklı ortama alınmalıdır","Donan bölge sertçe ovulmalıdır","Kar ile masaj yapılmalıdır","Aşırı sıcak suya sokulmalıdır"],a:0,e:"Kişi soğuktan uzaklaştırılır ve kontrollü biçimde ısıtılır."},

{c:"İlk Yardım",q:"Aşağıdakilerden hangisi ilk yardımcının yapmaması gereken davranıştır?",o:["Bilmediği ilaçları vermek","Olay yerini güvenli hâle getirmek","112'yi aramak","Yaralıyı gözlemlemek"],a:0,e:"İlk yardımcı doktor önerisi olmadan ilaç vermemelidir."},

{c:"İlk Yardım",q:"Hava yolu tıkanan ve öksürebilen kişiye nasıl davranılır?",o:["Öksürmeye teşvik edilir ve izlenir","Hemen su içirilir","Sırtüstü yatırılır","Yemek verilir"],a:0,e:"Etkili öksürük varsa kişinin öksürmesi desteklenir."},

{c:"İlk Yardım",q:"Kazazedeye müdahale etmeden önce ilk olarak ne değerlendirilmelidir?",o:["Olay yeri güvenliği","Kazazedenin yaşı","Aracın modeli","Havanın sıcaklığı"],a:0,e:"İlk yardımcı ve kazazedenin güvenliği önceliklidir."},

{c:"İlk Yardım",q:"Açık yarada aşağıdakilerden hangisi yapılmamalıdır?",o:["Yaraya saplanmış cismi çıkarmak","Kanamayı kontrol etmek","Temiz örtü kullanmak","Tıbbi yardım istemek"],a:0,e:"Saplanmış cisim çıkarılmamalı, çevresi desteklenmelidir."},

{c:"İlk Yardım",q:"Bayılan kişiye ne yapılmalıdır?",o:["Güvenli şekilde yatırılıp solunumu kontrol edilmelidir","Tokat atılmalıdır","Zorla su içirilmelidir","Hemen ayağa kaldırılmalıdır"],a:0,e:"Kişinin bilinci ve solunumu değerlendirilir, uygun yardım sağlanır."},

{c:"İlk Yardım",q:"Göze kimyasal madde kaçarsa ne yapılmalıdır?",o:["Bol temiz suyla yıkanmalı ve tıbbi yardım alınmalıdır","Göz ovuşturulmalıdır","Göz kapatılıp beklenmelidir","Göze krem sürülmelidir"],a:0,e:"Kimyasal temasında göz derhâl bol suyla yıkanmalıdır."},

{c:"İlk Yardım",q:"Yaralıya yaklaşırken sakin davranmanın önemi nedir?",o:["Panik oluşmasını azaltır","Kanamayı kesin durdurur","Kırığı iyileştirir","İlaç ihtiyacını ortadan kaldırır"],a:0,e:"Sakin davranmak hem yaralıyı hem çevredekileri rahatlatır."},

{c:"İlk Yardım",q:"Kazazedede solunum değerlendirmesi yapılırken neye bakılır?",o:["Göğüs hareketleri ve solunum belirtileri","Saç rengi","Ayakkabı numarası","Boy uzunluğu"],a:0,e:"Solunum belirtileri kısa süre içinde değerlendirilir."},

{c:"İlk Yardım",q:"Acil taşıma hangi durumda düşünülmelidir?",o:["Olay yerinde kalmak daha büyük tehlike oluşturuyorsa","Her küçük yaralanmada","Kişi konuşabiliyorsa","Yardım gelmeden önce mutlaka"],a:0,e:"Acil tehlike yoksa yaralı gereksiz yere taşınmamalıdır."},

{c:"İlk Yardım",q:"İlk yardımda ABC değerlendirmesi neyi ifade eder?",o:["Hava yolu, solunum, dolaşım","Araç, bakım, kontrol","Ateş, basınç, cilt","Acil, bekleme, çağrı"],a:0,e:"ABC; hava yolu açıklığı, solunum ve dolaşımın değerlendirilmesidir."},

{c:"İlk Yardım",q:"Elektrik çarpmasında kazazedeye yaklaşmadan önce ne yapılmalıdır?",o:["Elektrik kaynağı güvenli şekilde kesilmelidir","Kişiye çıplak elle dokunulmalıdır","Üzerine su dökülmelidir","Hemen çekiştirilmelidir"],a:0,e:"Elektrik akımı kesilmeden kişiye dokunmak tehlikelidir."},

{c:"İlk Yardım",q:"Yaralıya moral vermek neden önemlidir?",o:["Güven ve sakinlik sağlar","Yarayı anında iyileştirir","İlaç yerine geçer","Kanamayı kesin durdurur"],a:0,e:"Moral desteği yaralının kaygısını azaltmaya yardımcı olur."},

{c:"İlk Yardım",q:"Ciddi yaralanmada ilk yardımcının temel sorumluluğu nedir?",o:["Uygun ilk yardımı yapıp profesyonel yardım istemek","Kesin teşhis koymak","Reçete yazmak","Ameliyat yapmak"],a:0,e:"İlk yardımcı kendi eğitim ve yetki sınırları içinde hareket eder."},

{c:"İlk Yardım",q:"Bilinci kapalı kişiye ağızdan yiyecek veya içecek verilir mi?",o:["Hayır, verilmez","Evet, mutlaka verilir","Sadece süt verilir","Sadece su verilir"],a:0,e:"Bilinci kapalı kişiye ağızdan hiçbir şey verilmez."},

{c:"İlk Yardım",q:"Acil yardım çağrısında telefon kapatılmadan önce ne yapılmalıdır?",o:["Görevlinin yönlendirmeleri dinlenmelidir","Telefon hemen kapatılmalıdır","Başka biriyle konuşulmalıdır","Konum gizlenmelidir"],a:0,e:"Görevlinin soruları ve talimatları dikkatle takip edilmelidir."},

{c:"İlk Yardım",q:"Çıkık şüphesinde doğru davranış hangisidir?",o:["Eklem zorlanmadan sabitlenir","Eklem yerine oturtulmaya çalışılır","Bölge sertçe çekilir","Kişi egzersiz yaptırılır"],a:0,e:"Çıkık yerine oturtulmaya çalışılmaz; bölge sabitlenerek tıbbi yardım alınır."},

{c:"İlk Yardım",q:"Acil durumda olay yerinde kalabalığı uzaklaştırmak neden önemlidir?",o:["Müdahaleyi kolaylaştırmak ve güvenliği sağlamak için","Kazazedeyi yalnız bırakmak için","Trafiği hızlandırmak için","Fotoğraf çekmek için"],a:0,e:"Kalabalığın azaltılması müdahale alanını güvenli ve erişilebilir tutar."},

{c:"İlk Yardım",q:"İlk yardımda kişisel koruyucu ekipman kullanımı ne sağlar?",o:["İlk yardımcıyı ve kazazedeyi korumaya yardımcı olur","Kazayı önceden haber verir","Yarayı iyileştirir","Tıbbi müdahalenin yerini alır"],a:0,e:"Koruyucu ekipman bulaşma ve temas risklerini azaltır."},

{c:"İlk Yardım",q:"Solunumu normal olmayan bilinçsiz kişide ne yapılmalıdır?",o:["112 aranmalı ve temel yaşam desteği uygulanmalıdır","Yiyecek verilmelidir","Yürütülmelidir","Yalnız bırakılmalıdır"],a:0,e:"Normal solunum yoksa acil yardım çağrısı ve temel yaşam desteği gerekir."},

{c:"İlk Yardım",q:"İlk yardım uygulamasında öncelik nasıl belirlenir?",o:["Yaşamı tehdit eden durumlara öncelik verilir","En hafif yaralanmadan başlanır","Önce araç kontrol edilir","Önce kimlik bilgisi alınır"],a:0,e:"Hayati tehlike oluşturan durumlar önceliklidir."},

/* --------------------------------------------------
   UYGULAMA VERİLERİ
   -------------------------------------------------- */

const anahtar = "ehliyetHazirlik_v3";

let kayit = JSON.parse(localStorage.getItem(anahtar) || "{}");

if (!kayit.testler) kayit.testler = {};
if (!kayit.yanlislar) kayit.yanlislar = {};
if (!kayit.yazi) kayit.yazi = 19;
if (!kayit.koyu) kayit.koyu = false;

let aktifTest = null;
let aktifSorular = [];
let aktifSoru = 0;

function kaydet() {
  localStorage.setItem(anahtar, JSON.stringify(kayit));
}

function bugununTarihi() {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
}

function tarihYaz() {
  document.getElementById("tarih").textContent =
    new Date().toLocaleDateString("tr-TR", {
      weekday:"long", year:"numeric", month:"long", day:"numeric"
    });
}

function yaziUygula() {
  document.documentElement.style.setProperty("--yazi", kayit.yazi + "px");
}

function yaziArtir() {
  kayit.yazi = Math.min(30, kayit.yazi + 2);
  yaziUygula();
  kaydet();
}

function yaziAzalt() {
  kayit.yazi = Math.max(13, kayit.yazi - 2);
  yaziUygula();
  kaydet();
}

function temaUygula() {
  document.body.classList.toggle("koyu", kayit.koyu);
}

function temaDegistir() {
  kayit.koyu = !kayit.koyu;
  temaUygula();
  kaydet();
}

function karistir(dizi) {
  const a = [...dizi];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}


/* --------------------------------------------------
   GÜNLÜK SINAVLAR
   -------------------------------------------------- */

function gunlukTestleriHazirla() {
  const tarih = bugununTarihi();

  if (!kayit.testler[tarih]) {
    kayit.testler[tarih] = [];

    for (let i = 0; i < 3; i++) {
      const test = testOlustur();
      kayit.testler[tarih].push({
        sorular: test,
        cevaplar: {},
        tamamlandi: false,
        dogru: 0,
        yanlis: 0,
        tarih: tarih
      });
    }

    kaydet();
  }
}

function testOlustur() {
  const dagilim = {
    "İlk Yardım": 12,
    "Trafik ve Çevre": 23,
    "Araç Tekniği": 9,
    "Trafik Adabı": 6
  };

  let secilen = [];

  for (const kategori in dagilim) {
    const havuz = sorular.filter(s => s.c === kategori);
    const adet = dagilim[kategori];

    if (havuz.length < adet) {
      throw new Error(kategori + " soru havuzu yetersiz.");
    }

    secilen.push(...karistir(havuz).slice(0, adet));
  }

  secilen = karistir(secilen);

  return secilen.map((s, i) => {
    const secenekler = s.o.map((metin, index) => ({
      metin,
      dogru: index === s.a
    }));

    const karisikSecenekler = karistir(secenekler);

    return {
      c: s.c,
      q: s.q,
      o: karisikSecenekler.map(x => x.metin),
      a: karisikSecenekler.findIndex(x => x.dogru),
      e: s.e,
      sahne: s.sahne || false,
      altin: (i + 1) % 10 === 0
    };
  });
}

function testleriGoster() {
  gunlukTestleriHazirla();

  const tarih = bugununTarihi();
  const liste = kayit.testler[tarih];

  const alan = document.getElementById("testListesi");
  alan.innerHTML = "";

  liste.forEach((test, i) => {
    const cevapSayisi = Object.keys(test.cevaplar).length;
    const durum = test.tamamlandi ? "Tamamlandı" :
      cevapSayisi > 0 ? "Devam ediyor" : "Başlanmadı";

    const kart = document.createElement("div");
    kart.className = "test-kart";

    kart.innerHTML = `
      <b>${i+1}. Sınav</b>
      <p>${durum}</p>
      <p class="kucuk">${cevapSayisi}/50 soru cevaplandı</p>
      <button class="ana" onclick="sinavAc(${i})">
        ${test.tamamlandi ? "Sonucu görüntüle" :
          cevapSayisi ? "Devam et" : "Sınava başla"}
      </button>
    `;

    alan.appendChild(kart);
  });
}


/* --------------------------------------------------
   SAYFA GEÇİŞLERİ
   -------------------------------------------------- */

function sayfaGoster(id) {
  [
    "anaSayfa",
    "sinavSayfasi",
    "yanlisSayfasi",
    "istatistikSayfasi"
  ].forEach(x => document.getElementById(x).classList.add("gizli"));

  document.getElementById(id).classList.remove("gizli");
}

function anaSayfayaDon() {
  sayfaGoster("anaSayfa");
  testleriGoster();
}


/* --------------------------------------------------
   SINAV EKRANI
   -------------------------------------------------- */

function sinavAc(no) {
  const tarih = bugununTarihi();

  aktifTest = no;
  const test = kayit.testler[tarih][no];

  aktifSorular = test.sorular;
  aktifSoru = 0;

  while (
    aktifSoru < 50 &&
    test.cevaplar[aktifSoru] !== undefined
  ) {
    aktifSoru++;
  }

  if (aktifSoru >= 50) aktifSoru = 49;

  sayfaGoster("sinavSayfasi");
  soruGoster();
}

function mevcutTest() {
  return kayit.testler[bugununTarihi()][aktifTest];
}

function soruGoster() {
  const s = aktifSorular[aktifSoru];
  const test = mevcutTest();

  document.getElementById("soruNo").textContent =
    "Soru " + (aktifSoru + 1) + " / 50";

  document.getElementById("ilerleme").style.width =
    (Object.keys(test.cevaplar).length / 50 * 100) + "%";

  document.getElementById("altKategori").textContent = s.c;

  document.getElementById("altinEtiket").innerHTML =
    s.altin ? '<p class="turuncu" style="padding:8px;border-radius:10px;display:inline-block">⭐ Pekiştirme sorusu</p>' : "";

  document.getElementById("soruMetni").textContent = s.q;

  const sahne = document.getElementById("soruSahnesi");

  if (s.sahne) {
    sahne.innerHTML = `
      <div class="soru-gorsel">
        <b>🚦 Hareketli trafik sahnesi</b>
        <div class="yol">
          <div class="serit"></div>
          <div class="araba">🚗</div>
          <div class="yaya">🚶</div>
        </div>
        <div class="sahne-aciklama">
          Sahneyi izleyerek soruyu cevaplayınız.
        </div>
      </div>
    `;
  } else {
    sahne.innerHTML = "";
  }

  const cevapAlan = document.getElementById("cevaplar");
  cevapAlan.innerHTML = "";

  s.o.forEach((secenek, i) => {
    const b = document.createElement("button");
    b.className = "secim";
    b.textContent = String.fromCharCode(65+i) + ") " + secenek;

    b.onclick = () => cevapSec(i);

    cevapAlan.appendChild(b);
  });

  const eskiCevap = test.cevaplar[aktifSoru];

  if (eskiCevap !== undefined) {
    secimGoster(eskiCevap);
  } else {
    document.getElementById("geriBildirim").className =
      "geri-bildirim";
    document.getElementById("geriBildirim").textContent = "";
  }
}

function secimGoster(secim) {
  const s = aktifSorular[aktifSoru];
  const test = mevcutTest();

  const butonlar = document.querySelectorAll(".secim");

  butonlar.forEach((b, i) => {
    b.disabled = true;

    if (i === s.a) b.classList.add("dogru");
    if (i === secim && i !== s.a) b.classList.add("yanlis");
  });

  const geri = document.getElementById("geriBildirim");

  if (secim === s.a) {
    geri.className = "geri-bildirim dogru";
    geri.innerHTML = "✓ DOĞRU CEVAP!<br>" + s.e;
  } else {
    geri.className = "geri-bildirim yanlis";
    geri.innerHTML =
      "✕ YANLIŞ CEVAP!<br>" +
      "Doğru cevap: " + String.fromCharCode(65+s.a) +
      ") " + s.o[s.a] + "<br><br>" + s.e;
  }
}

function cevapSec(secim) {
  const test = mevcutTest();

  if (test.cevaplar[aktifSoru] !== undefined) return;

  const s = aktifSorular[aktifSoru];

  test.cevaplar[aktifSoru] = secim;

  if (secim !== s.a) {
    const id = soruKimligi(s);

    kayit.yanlislar[id] = {
      soru: s.q,
      secenekler: s.o,
      dogru: s.a,
      verilen: secim,
      aciklama: s.e,
      kategori: s.c
    };
  }

  kaydet();
  secimGoster(secim);
  testleriGoster();
}

function oncekiSoru() {
  if (aktifSoru > 0) {
    aktifSoru--;
    soruGoster();
  }
}

function sonrakiSoru() {
  if (aktifSoru < 49) {
    aktifSoru++;
    soruGoster();
  } else {
    sinaviBitir();
  }
}

function sinaviBitir() {
  const test = mevcutTest();

  const cevaplar = Object.entries(test.cevaplar);
  let dogru = 0;
  let yanlis = 0;

  cevaplar.forEach(([no, cevap]) => {
    if (test.sorular[Number(no)].a === cevap) dogru++;
    else yanlis++;
  });

  test.dogru = dogru;
  test.yanlis = yanlis;
  test.tamamlandi = cevaplar.length === 50;

  kaydet();

  alert(
    "Sınav sonucu\n\n" +
    "Doğru: " + dogru + "\n" +
    "Yanlış: " + yanlis + "\n" +
    "Cevaplanan: " + cevaplar.length + "/50"
  );

  anaSayfayaDon();
}


/* --------------------------------------------------
   YANLIŞ CEVAPLAR
   -------------------------------------------------- */

function soruKimligi(s) {
  return s.c + "|" + s.q;
}

function yanlislariGoster() {
  sayfaGoster("yanlisSayfasi");

  const alan = document.getElementById("yanlisListe");
  alan.innerHTML = "";

  const liste = Object.entries(kayit.yanlislar);

  if (liste.length === 0) {
    alan.innerHTML = "<p>Henüz yanlış cevap kaydın bulunmuyor.</p>";
    return;
  }

  liste.forEach(([id, s]) => {
    const satir = document.createElement("div");
    satir.className = "yanlis-satir";

    const dogruHarf = String.fromCharCode(65 + s.dogru);
    const yanlisHarf = String.fromCharCode(65 + s.verilen);

    satir.innerHTML = `
      <b>${s.kategori}</b>
      <p>${s.soru}</p>
      <p style="color:#d92d35">
        Senin cevabın: ${yanlisHarf}) ${s.secenekler[s.verilen]}
      </p>
      <p style="color:#168544">
        Doğru cevap: ${dogruHarf}) ${s.secenekler[s.dogru]}
      </p>
      <p>${s.aciklama}</p>
      <button class="kirmizi" onclick="yanlisiKaldir('${encodeURIComponent(id)}')">
        Listeden kaldır
      </button>
    `;

    alan.appendChild(satir);
  });
}

function yanlisiKaldir(encodedId) {
  const id = decodeURIComponent(encodedId);

  if (!kayit.yanlislar[id]) return;

  if (confirm("Bu yanlış soruyu listenizden kaldırmak istiyor musunuz?")) {
    delete kayit.yanlislar[id];
    kaydet();
    yanlislariGoster();
  }
}


/* --------------------------------------------------
   İSTATİSTİKLER
   -------------------------------------------------- */

function istatistikGoster() {
  sayfaGoster("istatistikSayfasi");

  let tamamlanan = 0;
  let toplamDogru = 0;
  let toplamYanlis = 0;

  Object.values(kayit.testler).forEach(gun => {
    gun.forEach(test => {
      if (test.tamamlandi) tamamlanan++;
      toplamDogru += test.dogru || 0;
      toplamYanlis += test.yanlis || 0;
    });
  });

  document.getElementById("istatistikMetni").innerHTML = `
    <p><b>Tamamlanan sınav:</b> ${tamamlanan}</p>
    <p><b>Toplam doğru:</b> ${toplamDogru}</p>
    <p><b>Toplam yanlış:</b> ${toplamYanlis}</p>
    <p><b>Yanlışlarım listesinde:</b> ${Object.keys(kayit.yanlislar).length}</p>
  `;
}


/* --------------------------------------------------
   BAŞLANGIÇ
   -------------------------------------------------- */

tarihYaz();
yaziUygula();
temaUygula();
gunlukTestleriHazirla();
testleriGoster();

</script>
