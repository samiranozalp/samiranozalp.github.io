<style>
:root {
    --bg: #f1f3f5;

    --text: #222222;

}

body.dark {
    --bg: #17191d;
    --card: #252930;
    --text: #ffffff;
    --button: #397fc0;
    --border: #444950;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    font-size: 19px;
}

.container {
    max-width: 650px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 27px;
}

.card {
    background: var(--card);
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
}

button {
    width: 100%;
    padding: 15px;
    margin: 6px 0;
    border: 0;
    border-radius: 10px;
    background: var(--button);
    color: white;
    font-size: 19px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.small-buttons {
    display: flex;
    gap: 8px;
}

.small-buttons button {
    flex: 1;
}

.answer {
    background: var(--bg);
    color: var(--text);
    border: 2px solid var(--border);
    text-align: left;
}

.answer.selected {
    border: 3px solid #269b55;
}

.answer.correct {
    background: #218c4b;
    color: white;
    border-color: #218c4b;
}

.answer.wrong {
    background: #c83232;
    color: white;
    border-color: #c83232;
}

.gold {
    color: #d69b00;
    font-weight: bold;
}

.hidden {
    display: none;
}

#question {
    font-size: 23px;
    line-height: 1.5;
}

#progress {
    height: 12px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 12px 0;
}

#bar {
    height: 100%;
    width: 0%;
    background: #28a45c;
}

.info {
    font-size: 16px;
    opacity: 0.8;
}

#geriBildirim {
    font-weight: bold;
    font-size: 22px;
    margin: 15px 0;
    line-height: 1.5;
}

</style>
</head>

// UYGULAMA DEĞİŞKENLERİ

let aktifSorular = [];
let cevaplar = {};
let mevcut = 0;
let aktifTest = "";
let buyukluk = 19;


// KAYIT SİSTEMİ

function kayitOku() {
    return JSON.parse(localStorage.getItem("ehliyetKayit") || "{}");
}

function kaydet(veri) {
    localStorage.setItem("ehliyetKayit", JSON.stringify(veri));
}


// KARIŞTIRMA

function karistir(dizi) {
    let a = [...dizi];

    for (let i = a.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }

    return a;
}


// GÜN HESAPLAMA

function bugununGunu() {

    let baslangic = localStorage.getItem("ehliyetBaslangic");

    if (!baslangic) {
        let bugun = new Date();
        baslangic = bugun.getFullYear() + "-" +
            String(bugun.getMonth()+1).padStart(2,"0") + "-" +
            String(bugun.getDate()).padStart(2,"0");

        localStorage.setItem("ehliyetBaslangic", baslangic);
    }

    let parcalar = baslangic.split("-");

    let ilk = new Date(
        Number(parcalar[0]),
        Number(parcalar[1])-1,
        Number(parcalar[2])
    );

    let simdi = new Date();

    ilk.setHours(0,0,0,0);
    simdi.setHours(0,0,0,0);

    let gun = Math.floor((simdi - ilk) / 86400000) + 1;

    if (gun < 1) gun = 1;
    if (gun > 14) gun = 14;

    return gun;
}


// ANA MENÜ

function gunTestleri() {

    let gun = bugununGunu();
    let html = `<h2>📅 ${gun}. Gün</h2>`;
    let kayit = kayitOku();

    for (let test = 1; test <= 3; test++) {

        let id = gun + "-" + test;

        let durum = "Başla";

        if (kayit[id]) {
            if (kayit[id].tamamlandi) {
                durum = "✅ Tamamlandı";
            } else {
                durum = "▶ Devam Et";
            }
        }

        html += `
        <button onclick="baslat('${id}')">
            ${test}. Test - ${durum}
        </button>`;
    }

    document.getElementById("testler").innerHTML = html;
}


// TESTİ BAŞLAT

function baslat(id) {

    aktifTest = id;

    let kayit = kayitOku();

    if (kayit[id] && kayit[id].sorular) {

        aktifSorular = kayit[id].sorular;
        cevaplar = kayit[id].cevaplar || {};
        mevcut = kayit[id].mevcut || 0;

    } else {

        let ilkYardim = karistir(
            sorular.filter(s => s.k === "İlk Yardım")
        ).slice(0,12);

        let trafik = karistir(
            sorular.filter(s => s.k === "Trafik")
        ).slice(0,23);

        let teknik = karistir(
            sorular.filter(s => s.k === "Araç Tekniği")
        ).slice(0,9);

        let adap = karistir(
            sorular.filter(s => s.k === "Trafik Adabı")
        ).slice(0,6);

        let secilen = [
            ...ilkYardim,
            ...trafik,
            ...teknik,
            ...adap
        ];

        aktifSorular = karistir(secilen).map((s, index) => {

            let secenekler = s.o.map((metin, i) => ({
                metin: metin,
                eski: i
            }));

            secenekler = karistir(secenekler);

            return {
                id: s.id,
                soru: s.s,
                secenek: secenekler.map(x => x.metin),
                cevap: secenekler.findIndex(x => x.eski === s.c),
                altin: false
            };
        });

        // HER 10. SORU ALTIN SORU

        [9,19,29,39,49].forEach(index => {
            aktifSorular[index].altin = true;
        });

        cevaplar = {};
        mevcut = 0;

        kayit[id] = {
            sorular: aktifSorular,
            cevaplar: cevaplar,
            mevcut: mevcut
        };

        kaydet(kayit);
    }

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("sonuc").classList.add("hidden");
    document.getElementById("yanlislar").classList.add("hidden");
    document.getElementById("istatistik").classList.add("hidden");
    document.getElementById("sinav").classList.remove("hidden");

    soruGoster();
}


// SORUYU GÖSTER

function soruGoster() {

    let s = aktifSorular[mevcut];

    document.getElementById("testBilgi").innerText =
        "Test: " + aktifTest;

    document.getElementById("soruNo").innerText =
        (mevcut + 1) + ". Soru / 50";

    document.getElementById("bar").style.width =
        ((mevcut + 1) / 50 * 100) + "%";

    document.getElementById("question").innerText = s.soru;

    document.getElementById("altin").innerHTML =
        s.altin ? '<span class="gold">⭐ ALTIN SORU ⭐</span>' : "";

    document.getElementById("oncekiButon").disabled =
        mevcut === 0;

    let html = "";

    s.secenek.forEach((secenek, i) => {

        let secili = cevaplar[mevcut] === i;
        let kilit = cevaplar[mevcut] !== undefined;

        let sinif = "answer";

        if (kilit && i === s.cevap) {
            sinif += " correct";
        }

        if (kilit && secili && i !== s.cevap) {
            sinif += " wrong";
        }

        if (secili) {
            sinif += " selected";
        }

        html += `
        <button
            class="${sinif}"
            onclick="cevapSec(${i})"
            ${kilit ? "disabled" : ""}>
            ${String.fromCharCode(65+i)}) ${secenek}
        </button>`;
    });

    document.getElementById("cevaplar").innerHTML = html;

    let bildirim = document.getElementById("geriBildirim");

    if (cevaplar[mevcut] !== undefined) {

        if (cevaplar[mevcut] === s.cevap) {

            bildirim.innerHTML = "✅ DOĞRU CEVAP!";
            bildirim.style.color = "#20a050";

        } else {

            bildirim.innerHTML =
                "❌ YANLIŞ!<br>Doğru cevap: " +
                s.secenek[s.cevap];

            bildirim.style.color = "#e04444";
        }

    } else {

        bildirim.innerHTML = "";
    }
}


// CEVAP SEÇ

function cevapSec(i) {

    if (cevaplar[mevcut] !== undefined) {
        return;
    }

    cevaplar[mevcut] = i;

    let kayit = kayitOku();

    kayit[aktifTest] = {
        sorular: aktifSorular,
        cevaplar: cevaplar,
        mevcut: mevcut
    };

    kaydet(kayit);

    soruGoster();
}


// ÖNCEKİ SORU

function onceki() {

    if (mevcut > 0) {

        mevcut--;

        let kayit = kayitOku();

        kayit[aktifTest].mevcut = mevcut;

        kaydet(kayit);

        soruGoster();
    }
}


// SONRAKİ SORU

function sonraki() {

    if (cevaplar[mevcut] === undefined) {
        alert("Lütfen önce bir cevap seçin.");
        return;
    }

    if (mevcut < 49) {

        mevcut++;

        let kayit = kayitOku();

        kayit[aktifTest].mevcut = mevcut;

        kaydet(kayit);

        soruGoster();

    } else {

        bitir();
    }
}


// TESTİ BİTİR

function bitir() {

    let dogru = 0;
    let yanlislar = [];

    aktifSorular.forEach((s, i) => {

        if (cevaplar[i] === s.cevap) {

            dogru++;

        } else {

            yanlislar.push({
                soru: s.soru,
                dogru: s.secenek[s.cevap],
                verilen: cevaplar[i] === undefined
                    ? "Boş"
                    : s.secenek[cevaplar[i]]
            });
        }
    });

    let kayit = kayitOku();

    kayit[aktifTest].tamamlandi = true;
    kayit[aktifTest].dogru = dogru;
    kayit[aktifTest].yanlislar = yanlislar;

    kaydet(kayit);

    document.getElementById("sinav").classList.add("hidden");
    document.getElementById("sonuc").classList.remove("hidden");

    document.getElementById("puan").innerText =
        "Puanınız: " + (dogru * 2);

    document.getElementById("dogru").innerText =
        "Doğru cevap: " + dogru;

    document.getElementById("yanlis").innerText =
        "Yanlış veya boş cevap: " + (50 - dogru);
}


// ANA MENÜYE DÖN

function menuyeDon() {

    document.getElementById("menu").classList.remove("hidden");
    document.getElementById("sinav").classList.add("hidden");
    document.getElementById("sonuc").classList.add("hidden");
    document.getElementById("yanlislar").classList.add("hidden");
    document.getElementById("istatistik").classList.add("hidden");

    gunTestleri();
}


// YANLIŞLAR

function yanlislariGoster() {

    let kayit = kayitOku();
    let html = "";

    Object.keys(kayit).forEach(id => {

        if (kayit[id].yanlislar) {

            kayit[id].yanlislar.forEach(s => {

                html += `
                <div class="card">
                    <b>${s.soru}</b>
                    <p>Verdiğiniz cevap: ${s.verilen}</p>
                    <p>Doğru cevap: <b>${s.dogru}</b></p>
                </div>`;
            });
        }
    });

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("yanlislar").classList.remove("hidden");

    document.getElementById("yanlisListe").innerHTML =
        html || "Henüz yanlış cevap kaydınız yok.";
}


// İSTATİSTİKLER

function istatistik() {

    let kayit = kayitOku();

    let tamam = 0;
    let puan = 0;

    Object.values(kayit).forEach(t => {

        if (t.tamamlandi) {
            tamam++;
            puan += t.dogru * 2;
        }
    });

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("istatistik").classList.remove("hidden");

    document.getElementById("istatistikYazi").innerHTML = `
        <h3>Tamamlanan test: ${tamam}</h3>
        <h3>Toplam puan: ${puan}</h3>
        <h3>Kalan test: ${42 - tamam}</h3>
    `;
}


// TEMA

function tema() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "ehliyetTema",
        document.body.classList.contains("dark") ? "dark" : "light"
    );
}


// YAZI BOYUTU

function fontDegistir(deger) {

    buyukluk += deger;

    if (buyukluk < 15) buyukluk = 15;
    if (buyukluk > 30) buyukluk = 30;

    document.body.style.fontSize = buyukluk + "px";

    document.getElementById("question").style.fontSize =
        (buyukluk + 4) + "px";
}


// KAYITLI TEMAYI YÜKLE

if (localStorage.getItem("ehliyetTema") === "dark") {
    document.body.classList.add("dark");
}


// BAŞLAT

gunTestleri();

</script>
